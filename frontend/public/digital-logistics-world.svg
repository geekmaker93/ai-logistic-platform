    <radialGradient id="ocean" cx="32%" cy="26%" r="75%">
      <stop offset="0%" stop-color="#68d8f8"/>
      <stop offset="38%" stop-color="#2588c8"/>
      <stop offset="72%" stop-color="#0d4a8c"/>
      <stop offset="100%" stop-color="#061e50"/>
    </radialGradient>
    <radialGradient id="land" cx="32%" cy="26%" r="75%">
